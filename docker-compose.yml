services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: fc-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: fc_user
      POSTGRES_PASSWORD: fc_password
      POSTGRES_DB: financial_compass
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: fc-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  pgdata:
